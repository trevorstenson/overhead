# Builds skyd for each platform and attaches it to the GitHub release for the
# tag, with its SHA-256 beside it; the mod downloads the one it needs on first
# use and checks it. Tag a release as v<version>, matching plugin.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  skyd:
    strategy:
      matrix:
        include:
          - runner: macos-15
            os: macos
            arch: arm64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE: skyd-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches plugin.json
        run: test "v$(jq -r .version .claude-plugin/plugin.json)" = "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: skyd
        run: cargo test --release

      - name: Build
        working-directory: skyd
        run: cargo build --release --locked

      - name: Package
        run: |
          tar -czf "$PACKAGE" -C skyd/target/release skyd
          shasum -a 256 "$PACKAGE" > "$PACKAGE.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGE }}
            ${{ env.PACKAGE }}.sha256

  mod:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate and test the mod
        run: |
          claude plugin validate --strict .
          claude plugin test .
